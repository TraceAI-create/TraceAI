[project]
name = "traceai"
version = "0.1.0"
description = "AI-powered decision traceability and audit system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.116.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "langchain-core>=1.6.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "sdk"]
testpaths = ["backend/tests", "sdk/tests"]
