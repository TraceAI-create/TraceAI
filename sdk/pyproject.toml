[project]
name = "traceai-sdk"
version = "0.1.0"
description = "Lightweight Python Audit SDK for AI Agents: Capture -> Store -> Replay -> Review -> Trust"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traceai_sdk"]
